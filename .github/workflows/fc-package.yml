name: Build validated FC deployment package
on:
  push:
    branches: [main]
    paths: ['public/**', 'deployment/fc/**', 'deployment/q4/**', '.github/workflows/fc-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test Timesheet totals adapter
        run: python -m unittest discover -s deployment/fc/tests -v
      - name: Build matching FC ZIP
        run: python deployment/fc/package.py --output fc-release --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: q4-planning-fc
          path: |
            fc-release/Q4-Planning-FC.zip
            fc-release/SHA256SUMS.txt
            fc-release/deployment.json
          if-no-files-found: error
          retention-days: 30